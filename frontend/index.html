<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Engine Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">

    <div id="auth-gate" class="min-h-screen flex items-center justify-center bg-zinc-950 px-4">
        <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-xl p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold tracking-wider text-zinc-100 font-mono">CELESTIAL//ENGINE</h1>
                <p id="auth-subtitle" class="text-xs text-zinc-500 font-medium tracking-wide">AUTHENTICATE SYSTEM ACCESS</p>
            </div>

            <div id="auth-error" class="hidden bg-red-950/40 border border-red-900/50 text-red-400 text-xs p-3 rounded-lg font-mono text-center"></div>
            <div id="auth-success" class="hidden bg-emerald-950/40 border border-emerald-900/50 text-emerald-400 text-xs p-3 rounded-lg font-mono text-center"></div>

            <form id="login-form" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[10px] uppercase tracking-widest text-zinc-500 font-mono font-bold">Email Address</label>
                    <input type="email" id="login-email" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-zinc-700 transition font-mono">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase tracking-widest text-zinc-500 font-mono font-bold">Access Password</label>
                    <input type="password" id="login-password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-zinc-700 transition font-mono">
                </div>
                <button type="submit" class="w-full bg-zinc-100 hover:bg-zinc-200 text-zinc-950 font-mono text-xs font-bold py-3 rounded-lg tracking-widest uppercase transition shadow-md">
                    Verify Credentials
                </button>
                <p class="text-center text-xs text-zinc-500 font-mono pt-2">
                    New system entity? <a href="#" id="go-to-register" class="text-zinc-300 underline hover:text-zinc-100">Create an account</a>
                </p>
            </form>

            <<form id="register-form" class="space-y-4 hidden">
                <div class="space-y-1">
                    <label class="text-[10px] uppercase tracking-widest text-zinc-500 font-mono font-bold">Email Address</label>
                    <input type="email" id="register-email" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-zinc-700 transition font-mono">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase tracking-widest text-zinc-500 font-mono font-bold">Choose Password</label>
                    <input type="password" id="register-password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-zinc-700 transition font-mono">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase tracking-widest text-zinc-500 font-mono font-bold">Birth Date</label>
                        <input type="date" id="register-birth-date" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2.5 text-xs text-zinc-200 focus:outline-none focus:border-zinc-700 transition font-mono">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase tracking-widest text-zinc-500 font-mono font-bold">Birth Time</label>
                        <input type="time" id="register-birth-time" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2.5 text-xs text-zinc-200 focus:outline-none focus:border-zinc-700 transition font-mono">
                    </div>
                </div>
                
                <div class="space-y-1">
                    <label class="text-[10px] uppercase tracking-widest text-zinc-500 font-mono font-bold">Birth Place (City, State/Country)</label>
                    <input type="text" id="register-birth-place" placeholder="e.g., Richland, WA" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-zinc-700 transition font-mono placeholder-zinc-700">
                </div>

                <button type="submit" class="w-full bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-100 font-mono text-xs font-bold py-3 rounded-lg tracking-widest uppercase transition shadow-md">
                    Register System Profile
                </button>
                <p class="text-center text-xs text-zinc-500 font-mono pt-2">
                    Existing operator? <a href="#" id="go-to-login" class="text-zinc-300 underline hover:text-zinc-100">Sign in here</a>
                </p>
            </form>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="font-bold tracking-widest text-sm uppercase text-zinc-200">Celestial//Engine</span>
                <span class="bg-zinc-800 text-zinc-400 text-[10px] uppercase px-2 py-0.5 rounded tracking-wide">Beta Tier</span>
            </div>
            <button id="logout-btn" class="text-xs font-medium uppercase tracking-wider border border-zinc-800 rounded px-3 py-1.5 text-zinc-400 hover:text-zinc-200 hover:border-zinc-600 transition cursor-pointer">
                Disconnect
            </button>
        </header>

        <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 shadow-xl">
                    <h2 class="text-xs font-bold uppercase tracking-widest text-zinc-400 mb-4 border-b border-zinc-800 pb-2">Active Transit Overlay</h2>
                    <div id="transit-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                        </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl min-h-[500px]">
                    <div class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-3">
                        <h2 class="text-xs font-bold uppercase tracking-widest text-zinc-400">Personalized Daily Analysis</h2>
                        <span id="forecast-date" class="text-xs text-zinc-500 font-mono">YYYY-MM-DD</span>
                    </div>
                    <div id="horoscope-content" class="prose prose-invert max-w-none text-zinc-300 space-y-4 leading-relaxed text-sm">
                        <p class="text-zinc-500 animate-pulse">Running geometric synthesis calculations...</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
