apiVersion: apps/v1
kind: Deployment
metadata:
  name: celestial-api
  namespace: celestial
  labels:
    app: celestial-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celestial-api
  template:
    metadata:
      labels:
        app: celestial-api
    spec:
      containers:
        - name: celestial-api
          image: hub.lab.local/library/celestial-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: celestial-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: celestial-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: celestial-secrets
                  key: JWT_SECRET_KEY
            - name: GLOBAL_FREE_BETA
              value: "True"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"